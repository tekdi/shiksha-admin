version: 1

settings:
  include:
    - "src/pages/**/*.tsx"
    - "src/app/**/*.tsx"
    - "src/components/**/*.tsx"
    - "src/lib/**/*.ts"
    - "src/utils/**/*.ts"
  exclude:
    - "node_modules/**/*"
    - "public/**/*"
    - ".next/**/*"

linting:
  eslint:
    enabled: true
    config: "./.eslintrc.json"
  prettier:
    enabled: true
    config: "./.prettierrc"

rules:
  best_practices:
    enforce_nextjs_image: true  # Use next/image instead of <img>
    enforce_nextjs_link: true   # Use next/link instead of <a>
    enforce_nextjs_script: true # Use next/script for third-party scripts
    avoid_direct_api_calls: true # Use getStaticProps/getServerSideProps for API calls
    react_hooks_rules: true     # Enforce React hooks rules

  security:
    avoid_raw_html: true  # Prevent dangerouslySetInnerHTML usage
    avoid_eval: true      # Prevent eval() usage
    enforce_csp: true     # Suggest proper Content Security Policy (CSP) headers

  performance:
    optimize_fonts: true  # Ensure fonts are loaded via next/font
    optimize_images: true # Ensure images are properly optimized

  accessibility:
    enforce_a11y: true # Enforce WCAG accessibility guidelines
