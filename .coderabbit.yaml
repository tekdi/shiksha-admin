include:
  - "src/pages/**/*.tsx"
  - "src/app/**/*.tsx"
  - "src/components/**/*.tsx"
  - "src/lib/**/*.ts"
  - "src/utils/**/*.ts"

exclude:
  - "node_modules/**/*"
  - "public/**/*"
  - ".next/**/*"

rules:
  eslint:
    enabled: true
    config: ".eslintrc.json"

  prettier:
    enabled: true
    config: ".prettierrc"

  best_practices:
    enforce_nextjs_image: true
    enforce_nextjs_link: true
    enforce_nextjs_script: true
    avoid_direct_api_calls: true
    react_hooks_rules: true

  security:
    avoid_raw_html: true
    avoid_eval: true
    enforce_content_security_policy: true

  performance:
    optimize_fonts: true
    optimize_images: true

  accessibility:
    a11y_rules: true
